name: Source-pinned analyzer engine
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    if: github.event.repository.private == false
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build from sources and run smoke tests
        run: bash build.sh
      - name: Keep generated binaries and corresponding source in git (no artifact or cache storage)
        run: |
          git config user.name 'Sesini Bul source build'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/engine.js dist/engine.wasm dist/corresponding-source.tar.gz dist/provenance.json
          git commit -m 'Build source-pinned analyzer engine'
          git push origin HEAD:main
